name: AI Secure Code Reviewer CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  security-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Create scan_results directory
        run: mkdir -p scan_results

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "scan_results/trivy-results.sarif"
          
      - name: Run Bandit SAST
        run: |
          mkdir -p scan_results
          python -m bandit \
            -r ai rules utils reports schemas \
            -f json \
            -o scan_results/bandit.json

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scan_results/trivy-results.sarif

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: scan_results/